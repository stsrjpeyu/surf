<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SWELL LOG">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>SWELL LOG — 海況チェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#05161C;
  --shelf:#0B2A34;
  --panel:#0E323D;
  --line:#1D4C58;
  --foam:#EEF4F2;
  --mute:#7FA3AC;
  --swell:#67C0D6;
  --gold:#D8A73B;
  --coral:#E2603F;
  --jp:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  --num:"Oswald",-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--abyss);
  color:var(--foam);
  font-family:var(--jp);
  font-size:15px;
  line-height:1.6;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 56px}

/* ---- masthead ---- */
.masthead{padding:22px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{font-family:var(--num);font-weight:600;font-size:19px;letter-spacing:.22em;text-transform:uppercase}
.mark span{color:var(--swell)}
.stamp{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.06em;text-align:right;white-space:nowrap}

/* ---- spot rail ---- */
.rail{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--mute);
  font-family:var(--jp);font-size:13px;font-weight:500;padding:7px 13px;border-radius:2px;
  cursor:pointer;transition:.15s;white-space:nowrap
}
.chip:hover{border-color:var(--swell);color:var(--foam)}
.chip[aria-pressed="true"]{background:var(--swell);border-color:var(--swell);color:var(--abyss);font-weight:700}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.areatag{flex:0 0 auto;align-self:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--line);padding:0 3px 0 7px;white-space:nowrap}
.areatag:first-child{padding-left:0}

/* ---- verdict ---- */
.verdict{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin-bottom:2px}
.vtop{display:flex;align-items:flex-end;gap:14px}
.hgt{font-family:var(--num);font-weight:200;font-size:76px;line-height:.82;letter-spacing:-.02em}
.hgt em{font-style:normal;font-size:22px;font-weight:400;color:var(--mute);margin-left:4px}
.vmeta{flex:1;padding-bottom:5px}
.vcall{font-size:17px;font-weight:700;letter-spacing:.02em}
.vsub{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.04em;margin-top:2px}
.gauge{margin-top:16px;height:3px;background:var(--line);position:relative;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--swell);transition:width .5s ease}
.gscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.08em;margin-top:6px}

/* ---- swell band (signature) ---- */
.band{margin:26px 0 0}
.bandhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.legend{font-family:var(--mono);font-size:10px;color:var(--mute);display:flex;gap:11px}
.legend b{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:-1px}
.scroller{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);background:var(--shelf);scrollbar-width:thin}
.scroller::-webkit-scrollbar{height:4px}
.scroller::-webkit-scrollbar-thumb{background:var(--line)}
.bandnote{font-size:11.5px;color:var(--mute);margin-top:8px;line-height:1.5}

/* ---- data grid ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:26px}
.cell{background:var(--abyss);padding:13px 14px 15px}
.cell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.cell .v{font-family:var(--num);font-weight:400;font-size:29px;line-height:1.15;margin-top:5px}
.cell .v small{font-size:13px;color:var(--mute);margin-left:3px;font-weight:200}
.cell .n{font-size:11.5px;color:var(--mute);margin-top:1px;line-height:1.45}
.cell.wide{grid-column:1/-1}

/* ---- compass ---- */
.rose{display:flex;align-items:center;gap:16px}
.rose svg{flex:0 0 auto}
.rosekey{font-size:12px;line-height:1.7}
.rosekey i{font-style:normal;display:inline-block;width:9px;height:2px;vertical-align:4px;margin-right:7px}

/* ---- breakdown ---- */
details{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--mute);cursor:pointer;text-transform:uppercase;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ＋";color:var(--swell)}
details[open] summary::after{content:" －"}
.bd{margin-top:12px}
.bdrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bdrow span:first-child{font-size:12px;width:74px;flex:0 0 auto;color:var(--mute)}
.bdbar{flex:1;height:2px;background:var(--line);position:relative}
.bdbar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.bdrow span:last-child{font-family:var(--mono);font-size:11px;width:34px;text-align:right;flex:0 0 auto}

/* ---- footer / states ---- */
.foot{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;font-size:11.5px;color:var(--mute);line-height:1.65}
.foot a{color:var(--swell);text-decoration:none;border-bottom:1px solid rgba(103,192,214,.35)}
.foot strong{color:var(--gold);font-weight:500}
.state{padding:44px 4px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.7}
.state b{display:block;color:var(--foam);font-family:var(--num);font-weight:400;font-size:17px;letter-spacing:.08em;margin-bottom:7px}
.retry{margin-top:16px;background:transparent;border:1px solid var(--swell);color:var(--swell);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;padding:9px 20px;cursor:pointer;border-radius:2px}
.retry:hover{background:var(--swell);color:var(--abyss)}
.state b.hl{display:inline;font-family:var(--jp);font-size:13.5px;font-weight:700;color:var(--gold);margin:0}
.diag{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);
  font-size:10px;line-height:1.6;color:var(--mute);text-align:left;word-break:break-all}
.diag a{color:var(--swell);text-decoration:none}
.diag span{display:block;margin-top:8px;font-family:var(--jp);font-size:11.5px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.hgt{font-size:62px}.cell .v{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="mark">Swell<span>·</span>Log</div>
    <div class="stamp" id="stamp">—</div>
  </div>

  <div class="rail" id="rail"></div>

  <div id="view">
    <div class="state"><b class="pulse">読み込み中</b>海況データを取得しています</div>
  </div>

  <div class="foot">
    データ元：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（波浪＝DWD GWM／Copernicus Marine、風＝GFS ほか、CC BY 4.0）。APIキー不要・非商用無料。<br>
    <strong>精度の前提：</strong>全球波浪モデルは約28km、潮位・流れは約8km解像度。岬・リーフ・河口などの局所地形は反映されません。潮位は平均海面（MSL）基準で、海図の基本水準面とは異なります。判定スコアは公開式による参考値です。<br>
    <strong>入水前に</strong>気象庁の波浪・強風・雷注意報と現地ライブカメラを必ず確認してください。
  </div>
</div>

<script>
"use strict";

/* ============================================================
   スポット定義
   facing = 海岸が海側を向く方位（度）。オフショア風はその逆方位から吹く。
   ============================================================ */
const SPOTS = [
  { id:"kugenuma", name:"鵠沼",     area:"湘南", lat:35.3120, lon:139.4700, facing:180 },
  { id:"tsujido",  name:"辻堂",     area:"湘南", lat:35.3130, lon:139.4510, facing:180 },

  { id:"usami",    name:"宇佐美",   area:"伊豆", lat:35.0330, lon:139.0940, facing: 80 },
  { id:"imaihama", name:"今井浜",   area:"伊豆", lat:34.7690, lon:139.0060, facing: 95 },
  { id:"shirahama",name:"白浜大浜", area:"伊豆", lat:34.6890, lon:138.9740, facing: 85 },
  { id:"tatado",   name:"多々戸浜", area:"伊豆", lat:34.6650, lon:138.9560, facing:120 },
  { id:"iritahama",name:"入田浜",   area:"伊豆", lat:34.6600, lon:138.9430, facing:170 },

  { id:"shizunami",name:"静波",     area:"静岡", lat:34.7370, lon:138.2280, facing:180 },
  { id:"omaezaki", name:"御前崎",   area:"静岡", lat:34.5980, lon:138.2260, facing:180 },
  { id:"irago",    name:"伊良湖",   area:"東海", lat:34.5850, lon:137.0280, facing:190 },

  { id:"shidashita",name:"志田下",  area:"千葉", lat:35.3720, lon:140.3930, facing:110 },
  { id:"katakai",  name:"片貝",     area:"千葉", lat:35.5310, lon:140.4540, facing:100 },
  { id:"oarai",    name:"大洗",     area:"茨城", lat:36.3130, lon:140.5960, facing:100 },
  { id:"sendai",   name:"仙台新港", area:"東北", lat:38.2670, lon:141.0200, facing: 95 },
  { id:"mase",     name:"間瀬",     area:"新潟", lat:37.7000, lon:138.7800, facing:300 },
  { id:"shishikui",name:"宍喰",     area:"四国", lat:33.5940, lon:134.3160, facing:140 },
  { id:"kizakihama",name:"木崎浜",  area:"宮崎", lat:31.8700, lon:131.4500, facing:110 }
];

const MARINE_VARS_FULL = [
  "wave_height","wave_period","wave_direction",
  "swell_wave_height","swell_wave_period","swell_wave_direction",
  "wind_wave_height","wind_wave_period",
  "sea_level_height_msl","ocean_current_velocity","ocean_current_direction",
  "sea_surface_temperature"
];
/* 一部変数はモデル未提供で 400 を返すことがあるため段階的に縮退させる */
const MARINE_VARS_CORE = [
  "wave_height","wave_period","wave_direction",
  "swell_wave_height","swell_wave_period","swell_wave_direction"
];

/* ============================================================
   ユーティリティ
   ============================================================ */
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const deg2pt = d => (d==null||isNaN(d)) ? "—" : COMPASS[Math.round(((d%360)+360)%360/22.5)%16];
const angDiff = (a,b) => { let d = Math.abs(((a-b)%360+360)%360); return d>180 ? 360-d : d; };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const fmt = (v,n=1) => (v==null||isNaN(v)) ? "—" : Number(v).toFixed(n);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 沿岸座標から facing 方位へ km 沖に出した座標を返す（陸上グリッド回避用） */
function seaward(lat, lon, facing, km){
  const r = facing*Math.PI/180;
  const dLat = (km*Math.cos(r))/111.32;
  const dLon = (km*Math.sin(r))/(111.32*Math.cos(lat*Math.PI/180));
  return [ +(lat+dLat).toFixed(4), +(lon+dLon).toFixed(4) ];
}

let LAST_URL = "";

async function getJSON(url){
  LAST_URL = url;
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 15000);
  let res;
  try{
    res = await fetch(url, { signal: ac.signal, mode:"cors" });
  }catch(e){
    // fetch 自体が失敗＝DNS / オフライン / サンドボックスによる遮断
    const err = new Error(e.name === "AbortError" ? "TIMEOUT" : "BLOCKED");
    err.kind = e.name === "AbortError" ? "timeout" : "blocked";
    throw err;
  }finally{
    clearTimeout(timer);
  }
  if(!res.ok){
    let detail = "";
    try { detail = (await res.json()).reason || ""; } catch(_){}
    const err = new Error(detail || ("HTTP " + res.status));
    err.kind = "api";
    throw err;
  }
  return res.json();
}

/* ============================================================
   取得：海（沖に段階的に離しつつ変数を縮退させてリトライ）
   ============================================================ */
async function fetchMarine(spot){
  const attempts = [];
  for(const km of [6,14,26]) for(const vars of [MARINE_VARS_FULL, MARINE_VARS_CORE]){
    attempts.push({km, vars});
  }
  let lastErr;
  for(const a of attempts){
    const [lat,lon] = seaward(spot.lat, spot.lon, spot.facing, a.km);
    const url = "https://marine-api.open-meteo.com/v1/marine"
      + "?latitude=" + lat + "&longitude=" + lon
      + "&hourly=" + a.vars.join(",")
      + "&timezone=Asia%2FTokyo&forecast_days=3";
    try{
      const j = await getJSON(url);
      const h = j.hourly && j.hourly.wave_height;
      if(h && h.some(v => v!=null)) return { data:j, offshoreKm:a.km, vars:a.vars };
      const e2 = new Error("この座標のモデル格子に波浪データがありません");
      e2.kind = "api"; lastErr = e2;
    }catch(e){
      lastErr = e;
      // 通信自体が遮断されている場合は座標を変えても無駄なので即中断
      if(e.kind === "blocked" || e.kind === "timeout") throw e;
    }
  }
  throw lastErr || new Error("海況データを取得できません");
}

async function fetchWind(spot){
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + spot.lat + "&longitude=" + spot.lon
    + "&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m"
    + "&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=3";
  return getJSON(url);
}

/* ============================================================
   評価ロジック（すべて公開式・内訳を画面に出す）
   ============================================================ */
function scoreSize(h){                       // 0.6–2.0m を良好帯とする
  if(h==null) return 0;
  if(h < 0.3) return 5;
  if(h < 0.6) return 40 + (h-0.3)/0.3*45;
  if(h <= 2.0) return 100;
  if(h <= 3.0) return 100 - (h-2.0)/1.0*45;
  return clamp(55 - (h-3.0)*25, 0, 55);
}
function scorePeriod(p){                     // 周期が長いほど整った波
  if(p==null) return 0;
  if(p < 5) return 15;
  if(p < 8) return 15 + (p-5)/3*45;
  if(p < 11) return 60 + (p-8)/3*35;
  return 100;
}
function windRelation(windFrom, facing){     // 風の吹いてくる方位 vs 陸側方位
  const offshoreFrom = (facing+180)%360;
  const d = angDiff(windFrom, offshoreFrom);
  if(d <= 45)  return { label:"オフショア", d, tier:0 };
  if(d <= 90)  return { label:"サイドオフ", d, tier:1 };
  if(d <= 135) return { label:"サイド",     d, tier:2 };
  return         { label:"オンショア",       d, tier:3 };
}
function scoreWind(sp, rel){
  if(sp==null) return 0;
  const base = [100,78,48,22][rel.tier];
  let pen = 0;
  if(rel.tier===0) pen = sp>8 ? (sp-8)*9 : 0;      // 強すぎるオフショアも減点
  else             pen = sp>3 ? (sp-3)*8 : 0;
  return clamp(base - pen, 0, 100);
}
function swellExposure(swellFrom, facing){   // うねりが正面から入るか
  if(swellFrom==null) return { label:"—", d:null };
  const d = angDiff(swellFrom, facing);
  if(d <= 40)  return { label:"正面", d };
  if(d <= 75)  return { label:"斜め", d };
  if(d <= 110) return { label:"かすめる", d };
  return         { label:"入りにくい", d };
}
function totalScore(h, p, sp, rel){
  const s = scoreSize(h), q = scorePeriod(p), w = scoreWind(sp, rel);
  return { size:s, period:q, wind:w, total: Math.round(s*0.35 + q*0.30 + w*0.35) };
}
function verdictOf(t, h){
  if(h!=null && h < 0.3) return "フラット";
  if(t >= 78) return "かなり良い";
  if(t >= 62) return "遊べる";
  if(t >= 45) return "コンディション次第";
  if(t >= 28) return "厳しい";
  return "見送り推奨";
}

/* ============================================================
   シグネチャ：48時間スウェルバンド（潮位カーブ＋波高バー）
   ============================================================ */
function renderBand(rows, nowIdx){
  const N = Math.min(rows.length, 48);
  const CW = 21, H = 132, PADT = 16, PADB = 22;
  const W = N*CW;
  const hs = rows.slice(0,N).map(r=>r.h).filter(v=>v!=null);
  const hMax = Math.max(1.2, hs.length ? Math.max(...hs)*1.15 : 1.2);
  const tides = rows.slice(0,N).map(r=>r.tide).filter(v=>v!=null);
  const hasTide = tides.length > 2;
  const tMin = hasTide ? Math.min(...tides) : 0;
  const tMax = hasTide ? Math.max(...tides) : 1;
  const tRange = (tMax-tMin) || 1;

  const barColor = r => {
    if(r.wrel==null) return "#3E6E7A";
    return ["#D8A73B","#9FB86A","#5E93A6","#3E6E7A"][r.wrel.tier];
  };

  let bars = "", ticks = "", tidePts = [];
  for(let i=0;i<N;i++){
    const r = rows[i], x = i*CW;
    const bh = r.h==null ? 0 : (r.h/hMax)*(H-PADT-PADB);
    bars += `<rect x="${x+4}" y="${H-PADB-bh}" width="${CW-8}" height="${Math.max(bh,1)}" fill="${barColor(r)}" opacity="${i<nowIdx?0.32:0.95}"/>`;
    if(hasTide && r.tide!=null){
      tidePts.push(`${x+CW/2},${(PADT-4) + (1-(r.tide-tMin)/tRange)*(H-PADT-PADB-6)}`);
    }
    const hh = new Date(r.t).getHours();
    if(hh%3===0){
      ticks += `<text x="${x+CW/2}" y="${H-7}" fill="#7FA3AC" font-family="JetBrains Mono,monospace" font-size="9" text-anchor="middle">${String(hh).padStart(2,"0")}</text>`;
      if(hh===0) ticks += `<line x1="${x}" y1="${PADT-8}" x2="${x}" y2="${H-PADB}" stroke="#1D4C58" stroke-width="1"/>`;
    }
  }
  const tideLine = tidePts.length>2
    ? `<polyline points="${tidePts.join(" ")}" fill="none" stroke="#67C0D6" stroke-width="1.25" stroke-opacity=".55" stroke-linejoin="round"/>` : "";
  const nowX = nowIdx*CW + CW/2;
  const nowMark = `<line x1="${nowX}" y1="${PADT-10}" x2="${nowX}" y2="${H-PADB}" stroke="#EEF4F2" stroke-width="1"/>
    <text x="${nowX+4}" y="${PADT-3}" fill="#EEF4F2" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="1">NOW</text>`;

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="48時間の波高と潮位の推移">
    <line x1="0" y1="${H-PADB}" x2="${W}" y2="${H-PADB}" stroke="#1D4C58"/>
    ${bars}${tideLine}${ticks}${nowMark}</svg>`;
}

/* ============================================================
   コンパス
   ============================================================ */
function renderRose(facing, windFrom, swellFrom){
  const R = 34, C = 40;
  const arrow = (deg, color, len) => {
    if(deg==null) return "";
    const rad = ((deg+180)%360 - 90) * Math.PI/180;   // 「〜から」を矢の向きに変換
    const x = C + Math.cos(rad)*len, y = C + Math.sin(rad)*len;
    return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${color}"/>`;
  };
  const fr = (facing-90)*Math.PI/180;
  return `<svg width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="風とうねりの方位">
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#1D4C58"/>
    <path d="M ${C+Math.cos(fr-1.05)*R} ${C+Math.sin(fr-1.05)*R} A ${R} ${R} 0 0 1 ${C+Math.cos(fr+1.05)*R} ${C+Math.sin(fr+1.05)*R}"
          fill="none" stroke="#3E6E7A" stroke-width="5" opacity=".85"/>
    <text x="${C}" y="9" fill="#7FA3AC" font-family="JetBrains Mono,monospace" font-size="8" text-anchor="middle">N</text>
    ${arrow(swellFrom, "#67C0D6", 26)}
    ${arrow(windFrom, "#D8A73B", 19)}
    <circle cx="${C}" cy="${C}" r="2" fill="#EEF4F2"/></svg>`;
}

/* ============================================================
   描画
   ============================================================ */
function render(spot, marine, wind){
  const M = marine.data.hourly, W = wind.hourly;
  const times = M.time;
  const now = new Date();
  const key = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-"
            + String(now.getDate()).padStart(2,"0") + "T" + String(now.getHours()).padStart(2,"0") + ":00";
  let idx = times.indexOf(key);
  if(idx < 0) idx = 0;

  const wIdx = W.time.indexOf(key);
  const wAt = i => {
    const j = wIdx<0 ? i : wIdx - idx + i;
    return (j>=0 && j<W.time.length) ? j : null;
  };

  const pick = (arr,i) => (arr && arr[i]!=null) ? arr[i] : null;
  const rows = times.map((t,i) => {
    const wj = wAt(i);
    const wd = wj==null ? null : pick(W.wind_direction_10m, wj);
    return {
      t, h: pick(M.wave_height,i), p: pick(M.wave_period,i),
      sw: pick(M.swell_wave_height,i), swp: pick(M.swell_wave_period,i), swd: pick(M.swell_wave_direction,i),
      dir: pick(M.wave_direction,i), tide: pick(M.sea_level_height_msl,i),
      ws: wj==null ? null : pick(W.wind_speed_10m, wj),
      wd, wrel: wd==null ? null : windRelation(wd, spot.facing)
    };
  });

  const c = rows[idx];
  const rel = c.wrel || { label:"—", tier:3, d:null };
  const sc = totalScore(c.h, c.p, c.ws, rel);
  const exp = swellExposure(c.swd!=null ? c.swd : c.dir, spot.facing);
  const gust = wIdx>=0 ? pick(W.wind_gusts_10m, wIdx) : null;
  const air  = wIdx>=0 ? pick(W.temperature_2m, wIdx) : null;
  const sst  = pick(M.sea_surface_temperature, idx);
  const cur  = pick(M.ocean_current_velocity, idx);
  const curd = pick(M.ocean_current_direction, idx);
  const tideNow = c.tide;
  const tide3 = rows[idx+3] ? rows[idx+3].tide : null;
  const tideTrend = (tideNow!=null && tide3!=null)
    ? (tide3 - tideNow > 0.05 ? "上げ潮" : (tideNow - tide3 > 0.05 ? "下げ潮" : "止まり気味")) : "—";

  document.getElementById("stamp").textContent =
    new Date().toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) + " 更新";

  const html = `
  <div class="verdict">
    <div class="vtop">
      <div class="hgt">${fmt(c.h,1)}<em>m</em></div>
      <div class="vmeta">
        <div class="vcall">${verdictOf(sc.total, c.h)}</div>
        <div class="vsub">${fmt(c.p,0)}s / ${deg2pt(c.swd!=null?c.swd:c.dir)}うねり / ${rel.label} ${fmt(c.ws,1)}m/s</div>
      </div>
    </div>
    <div class="gauge"><i style="width:${sc.total}%"></i></div>
    <div class="gscale"><span>見送り</span><span>参考スコア ${sc.total}</span><span>good</span></div>
  </div>

  <div class="band">
    <div class="bandhead">
      <div class="eyebrow">48h Swell &amp; Tide</div>
      <div class="legend"><span><b style="background:#D8A73B"></b>オフ</span><span><b style="background:#3E6E7A"></b>オン</span><span><b style="background:#67C0D6"></b>潮位</span></div>
    </div>
    <div class="scroller" id="scroller">${renderBand(rows, idx)}</div>
    <div class="bandnote">バーの高さ＝波高、色＝その時刻の風の向き。細い線＝潮位の推移。左右にスクロールできます。</div>
  </div>

  <div class="grid">
    <div class="cell">
      <div class="k">Swell</div>
      <div class="v">${fmt(c.sw!=null?c.sw:c.h,1)}<small>m</small></div>
      <div class="n">周期 ${fmt(c.swp!=null?c.swp:c.p,1)}s ・ ${deg2pt(c.swd!=null?c.swd:c.dir)}（${exp.label}）</div>
    </div>
    <div class="cell">
      <div class="k">Wind</div>
      <div class="v">${fmt(c.ws,1)}<small>m/s</small></div>
      <div class="n">${rel.label} ${deg2pt(c.wd)}${gust!=null ? " ・ 最大 "+fmt(gust,0)+"m/s" : ""}</div>
    </div>
    <div class="cell">
      <div class="k">Tide</div>
      <div class="v">${tideNow!=null ? (tideNow>0?"+":"")+fmt(tideNow,2) : "—"}<small>m</small></div>
      <div class="n">${tideTrend}（平均海面基準）</div>
    </div>
    <div class="cell">
      <div class="k">Current</div>
      <div class="v">${cur!=null ? fmt(cur,2) : "—"}<small>m/s</small></div>
      <div class="n">${curd!=null ? deg2pt(curd)+"へ流れる" : "モデル未提供"}</div>
    </div>
    <div class="cell wide">
      <div class="k">Direction</div>
      <div class="rose">
        ${renderRose(spot.facing, c.wd, c.swd!=null?c.swd:c.dir)}
        <div class="rosekey">
          <div><i style="background:#D8A73B"></i>風 ${deg2pt(c.wd)}から（${rel.label}）</div>
          <div><i style="background:#67C0D6"></i>うねり ${deg2pt(c.swd!=null?c.swd:c.dir)}から（${exp.label}）</div>
          <div><i style="background:#3E6E7A"></i>${spot.name}は${deg2pt(spot.facing)}向き</div>
        </div>
      </div>
    </div>
    <div class="cell">
      <div class="k">Water</div>
      <div class="v">${sst!=null ? fmt(sst,1) : "—"}<small>℃</small></div>
      <div class="n">${sst!=null ? wetsuit(sst) : "モデル未提供"}</div>
    </div>
    <div class="cell">
      <div class="k">Air</div>
      <div class="v">${fmt(air,1)}<small>℃</small></div>
      <div class="n">${air!=null && sst!=null ? "水温差 "+fmt(Math.abs(air-sst),1)+"℃" : "—"}</div>
    </div>
  </div>

  <details>
    <summary>スコアの内訳</summary>
    <div class="bd">
      <div class="bdrow"><span>サイズ 35%</span><span class="bdbar"><i style="width:${sc.size}%"></i></span><span>${Math.round(sc.size)}</span></div>
      <div class="bdrow"><span>周期 30%</span><span class="bdbar"><i style="width:${sc.period}%"></i></span><span>${Math.round(sc.period)}</span></div>
      <div class="bdrow"><span>風 35%</span><span class="bdbar"><i style="width:${sc.wind}%"></i></span><span>${Math.round(sc.wind)}</span></div>
      <div class="bandnote">サイズは0.6〜2.0mを満点、周期は11秒以上を満点、風はオフショア微風を満点として計算しています。うねりの向き（${exp.label}）はスコアに含めず参考表示です。取得点は${spot.name}沖 約${marine.offshoreKm}km のモデル格子です。</div>
    </div>
  </details>`;

  document.getElementById("view").innerHTML = html;
  const sc2 = document.getElementById("scroller");
  if(sc2) sc2.scrollLeft = Math.max(0, idx*21 - 40);
}

function wetsuit(sst){
  if(sst>=26) return "板ショーツで入れる水温";
  if(sst>=23) return "タッパー〜シーガル";
  if(sst>=19) return "3mmフルスーツ";
  if(sst>=15) return "5mm＋ブーツ";
  return "セミドライ＋ブーツ・グローブ";
}

/* ============================================================
   制御
   ============================================================ */
let current = SPOTS[0].id;

function buildRail(){
  const rail = document.getElementById("rail");
  let last = null, html = "";
  for(const s of SPOTS){
    if(s.area !== last){ html += `<span class="areatag">${s.area}</span>`; last = s.area; }
    html += `<button class="chip" data-id="${s.id}" aria-pressed="${s.id===current}">${s.name}</button>`;
  }
  rail.innerHTML = html;
  rail.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    current = b.dataset.id;
    buildRail(); load();
    const act = rail.querySelector('[aria-pressed="true"]');
    if(act) act.scrollIntoView({inline:"center", block:"nearest"});
  }));
}

async function load(){
  const spot = SPOTS.find(s => s.id===current);
  document.getElementById("view").innerHTML =
    `<div class="state"><b class="pulse">${spot.name}</b>海況データを取得しています</div>`;
  try{
    const [marine, wind] = await Promise.all([
      fetchMarine(spot),
      fetchWind(spot).catch(() => ({ hourly:{ time:[], wind_speed_10m:[], wind_direction_10m:[], wind_gusts_10m:[], temperature_2m:[] } }))
    ]);
    render(spot, marine, wind);
  }catch(e){
    let title, body;
    if(e.kind === "blocked"){
      title = "外部通信がブロックされています";
      body = `このページが埋め込みプレビュー（サンドボックス）内で開かれている可能性があります。<br>
              <b class="hl">HTMLファイルを保存して、Safari / Chrome で直接開いてください。</b>
              Open-Meteo側は CORS を全許可しているため、通常のブラウザなら取得できます。`;
    }else if(e.kind === "timeout"){
      title = "応答がありません";
      body = "15秒以内に応答がありませんでした。電波状況を確認してください。";
    }else{
      title = "APIがデータを返しませんでした";
      body = escapeHtml(e.message);
    }
    document.getElementById("view").innerHTML =
      `<div class="state"><b>${title}</b>${body}
        <br><button class="retry" id="retry">再取得</button>
        <div class="diag">最後のリクエスト<br>
          <a href="${escapeHtml(LAST_URL)}" target="_blank" rel="noopener">${escapeHtml(LAST_URL)}</a>
          <br><span>↑ これを別タブで開いてJSONが表示されれば、通信経路ではなくこのページの実行環境が原因です。</span>
        </div></div>`;
    const r = document.getElementById("retry");
    if(r) r.addEventListener("click", load);
  }
}

buildRail();
load();
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
</script>
</body>
</html>
